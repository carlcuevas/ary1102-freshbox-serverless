# Un solo ALB; el ALB despacha por metodo HTTP (reemplaza al Nginx del EP2, que ya no existe).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freshbox-ingress
  namespace: ${NAMESPACE}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/subnets: ${PUB_A},${PUB_B}
    alb.ingress.kubernetes.io/security-groups: ${SG_ALB}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/load-balancer-name: freshbox-eks-alb
    alb.ingress.kubernetes.io/conditions.get-products: '[{"field":"http-request-method","httpRequestMethodConfig":{"Values":["GET"]}}]'
    alb.ingress.kubernetes.io/conditions.create-product: '[{"field":"http-request-method","httpRequestMethodConfig":{"Values":["POST"]}}]'
    alb.ingress.kubernetes.io/conditions.update-product: '[{"field":"http-request-method","httpRequestMethodConfig":{"Values":["PUT"]}}]'
    alb.ingress.kubernetes.io/conditions.delete-product: '[{"field":"http-request-method","httpRequestMethodConfig":{"Values":["DELETE"]}}]'
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - { path: /api/products, pathType: Prefix, backend: { service: { name: get-products,   port: { number: 3001 } } } }
      - { path: /api/products, pathType: Prefix, backend: { service: { name: create-product, port: { number: 3002 } } } }
      - { path: /api/products, pathType: Prefix, backend: { service: { name: update-product, port: { number: 3003 } } } }
      - { path: /api/products, pathType: Prefix, backend: { service: { name: delete-product, port: { number: 3004 } } } }
