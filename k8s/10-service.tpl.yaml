# Plantilla por microservicio (Deployment + Service + HPA). Variables: SVC, PORT, NAMESPACE, ECR_URI
apiVersion: apps/v1
kind: Deployment
metadata: { name: ${SVC}, namespace: ${NAMESPACE} }
spec:
  replicas: 1
  selector: { matchLabels: { app: ${SVC} } }
  template:
    metadata: { labels: { app: ${SVC} } }
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: { matchLabels: { app: ${SVC} } }
      containers:
      - name: ${SVC}
        image: ${ECR_URI}/freshbox-${SVC}:latest
        imagePullPolicy: Always
        ports: [{ containerPort: ${PORT} }]
        env: [{ name: PORT, value: "${PORT}" }]
        envFrom:
        - configMapRef: { name: app-config }
        - secretRef: { name: app-db }
        resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 256Mi } }
        readinessProbe: { httpGet: { path: /health, port: ${PORT} }, initialDelaySeconds: 5, periodSeconds: 10 }
        livenessProbe: { httpGet: { path: /health, port: ${PORT} }, initialDelaySeconds: 15, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: ${SVC}, namespace: ${NAMESPACE} }
spec: { selector: { app: ${SVC} }, ports: [{ port: ${PORT}, targetPort: ${PORT} }], type: ClusterIP }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ${SVC}-hpa, namespace: ${NAMESPACE} }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ${SVC} }
  minReplicas: 1
  maxReplicas: 3
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 50 } } }]
  behavior:
    scaleUp: { stabilizationWindowSeconds: 0, policies: [{ type: Pods, value: 2, periodSeconds: 30 }] }
    scaleDown: { stabilizationWindowSeconds: 120 }
